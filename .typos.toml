# https://github.com/crate-ci/typos
# install:  cargo install typos-cli
# run:      typos

[files]
# Licence texts are copied verbatim.
extend-exclude = ["LICENSE", "crates/eppi-stats/COPYING*", "assets/fonts/*.txt"]

[default.extend-words]
egui = "egui"
# Melee: teching is rolling or getting up on landing, and FoD is
# Fountain of Dreams.
teching = "teching"
teched = "teched"
FoD = "FoD"
Fo = "Fo"
