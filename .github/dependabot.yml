# Monthly update pull requests, grouped so there's one per kind. A version
# has to be out for 7 days before Dependabot proposes it (cooldown), which
# gives a hijacked release time to be caught and pulled. Security fixes
# skip the wait.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
