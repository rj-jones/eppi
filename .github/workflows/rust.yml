on: [push, pull_request, workflow_dispatch]

name: CI

permissions:
  contents: write

env:
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev
      - run: cargo build --release -p eppi --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: cp target/${{ matrix.target }}/release/eppi${{ matrix.extension }} eppi-${{ matrix.target }}${{ matrix.extension }}
      - uses: actions/upload-artifact@v4
        with:
          name: eppi-${{ matrix.target }}${{ matrix.extension }}
          path: eppi-${{ matrix.target }}${{ matrix.extension }}
      - uses: svenstaro/upload-release-action@v2
        name: Upload binaries to release
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: eppi-${{ matrix.target }}${{ matrix.extension }}
          asset_name: eppi-${{ matrix.target }}${{ matrix.extension }}
          tag: ${{ github.ref }}
          overwrite: true
