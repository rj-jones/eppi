# Builds the downloads and publishes a GitHub release.
#
# To release: bump `version` in Cargo.toml, add a section for it to
# CHANGELOG.md, commit, then tag and push the tag:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# Running it by hand (Actions > Release > Run workflow) builds the same
# downloads as workflow artifacts without publishing anything, to try it.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos
            os: macos-latest
          # The oldest supported Ubuntu, so the binary runs on older glibc.
          - name: linux-x64
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin, x86_64-apple-darwin' || '' }}

      - name: Version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag is $GITHUB_REF_NAME but Cargo.toml says $version"
            exit 1
          fi

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libdbus-1-dev

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          # The C runtime goes into the exe, so it runs without the Visual C++
          # redistributable.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked -p eppi
          out="eppi-${{ steps.version.outputs.version }}-windows-x64"
          mkdir -p "$out" dist
          cp target/release/eppi.exe "$out/Eppi.exe"
          cp LICENSE "$out/LICENSE.txt"
          cp assets/README.md "$out/ASSETS.md"
          7z a -tzip "dist/$out.zip" "./$out/*" >/dev/null

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked -p eppi --target aarch64-apple-darwin
          cargo build --release --locked -p eppi --target x86_64-apple-darwin
          # One binary for Apple Silicon and Intel Macs.
          lipo -create -output eppi \
            target/aarch64-apple-darwin/release/eppi \
            target/x86_64-apple-darwin/release/eppi
          out="eppi-${{ steps.version.outputs.version }}-macos"
          mkdir -p "$out" dist
          scripts/macos-app.sh eppi "$out/Eppi.app"
          cp LICENSE "$out/LICENSE.txt"
          cp assets/README.md "$out/ASSETS.md"
          ditto -c -k --keepParent "$out" "dist/$out.zip"

      - name: Build and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p eppi
          out="eppi-${{ steps.version.outputs.version }}-linux-x64"
          mkdir -p "$out" dist
          install -m 755 target/release/eppi "$out/eppi"
          install -m 755 scripts/install.sh "$out/install.sh"
          cp assets/icon-256.png "$out/eppi.png"
          cp LICENSE "$out/LICENSE.txt"
          cp assets/README.md "$out/ASSETS.md"
          tar -czf "dist/$out.tar.gz" "$out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Lets anyone check a download was built here, from this tag:
      #   gh attestation verify <file> --repo rj-jones/eppi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # This version's section of the changelog.
          awk -v v="$version" '
            /^## / { if (on) exit; if (index($0, "[" v "]")) { on = 1; next } }
            /^\[[^]]+\]: / { if (on) exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat .github/release-footer.md >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Eppi ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
