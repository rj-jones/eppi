[workspace]
members = ["crates/eppi-stats", "crates/eppi-rank"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/rj-jones/eppi"
homepage = "https://github.com/rj-jones/eppi"
authors = ["rj-jones <rjjones@fastmail.com>"]

[workspace.dependencies]
peppi = "2.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[package]
name = "eppi"
version = "1.0.0"
description = "A fast desktop app for your Slippi replays: sets, stats, ranks and opponents."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["slippi", "melee", "replay", "ssbm", "egui"]
categories = ["games"]
publish = false
default-run = "eppi"

[dependencies]
eppi-stats = { path = "crates/eppi-stats" }
eppi-rank = { path = "crates/eppi-rank" }
peppi.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.37", features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rusqlite = { version = "0.41", features = ["bundled"] }
notify = "8"
rayon = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
env_logger = "0.11"
open = "5"
rfd = "0.18.0"
notify-rust = "4.18.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"

# Replays parse fast enough to use in debug builds too.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
embed-resource = "3"
